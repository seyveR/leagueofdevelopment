name: liga-mvp
services:
  mobile-app:
    image: liga-mobile:0.2.1
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      api-be:
        condition: service_healthy
    restart: unless-stopped
  api-be:
    image: liga-api:0.2.1
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_NAME: liga
      DB_USER: liga
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: liga
      POSTGRES_USER: liga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - liga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liga -d liga"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  liga-data:

